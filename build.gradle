plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"lumen-terrain-engine" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

/*
 * ---------------------------------------------------------------------------
 * Cross-platform native packaging
 * ---------------------------------------------------------------------------
 *
 * Layout produced/consumed:
 *
 *   native/artifacts/<platform-id>/LumenTerrainEngine.<ext>
 *       <- staging dir; each platform's build drops its binary here
 *          (windows-x86_64, linux-x86_64, linux-arm64, macos-x86_64,
 *           macos-arm64)
 *
 *   <mod jar>!/native/<platform-id>/libLumenTerrainEngine.<ext>
 *       <- final packaged layout consumed by NativeLoader at runtime
 *
 * The local CMake build (native/build/...) remains fully independent for
 * development/testing; a Gradle task copies its output into staging.
 * Missing platforms are simply absent from the JAR - NativeLoader treats
 * that as "CPU fallback", never as an error.
 */
def nativeStagingDir = layout.buildDirectory.dir("native-staging")

def nativePlatforms = [
    [id: 'windows-x86_64', ext: 'dll'],
    [id: 'linux-x86_64',   ext: 'so'],
    [id: 'linux-arm64',    ext: 'so'],
    [id: 'macos-x86_64',   ext: 'dylib'],
    [id: 'macos-arm64',    ext: 'dylib']
]

// Canonical bundled name per OS family (matches Platform.libraryFileName())
def canonicalNameFor = { String platformId ->
    if (platformId.startsWith('windows')) return 'LumenTerrainEngine.dll'
    if (platformId.startsWith('macos'))   return 'libLumenTerrainEngine.dylib'
    return 'libLumenTerrainEngine.so'
}

// Local dev-build artifact (produced by CMake on this machine).
def localNativeArtifact = file("native/build/Release/LumenTerrainEngine.dll")

def localPlatformId = 'windows-x86_64'

tasks.register('stageLocalNativeLibrary', Copy) {
    description = 'Copies the locally built Windows DLL into native staging.'
    group = 'lte native'
    onlyIf { localNativeArtifact.exists() }
    from(localNativeArtifact)
    into(nativeStagingDir.map { it.dir(localPlatformId) })
}

// Stage pre-built binaries from native/artifacts/<platform>/ when present
// (this is where CI builds for other platforms drop their outputs).
nativePlatforms.each { p ->
    def src = file("native/artifacts/${p.id}/LumenTerrainEngine.${p.ext}")

    tasks.register("stage${p.id}NativeLibrary", Copy) {
        description = "Stages the ${p.id} native binary for JAR bundling."
        group = 'lte native'
        onlyIf { src.exists() }
        from(src) {
            rename { canonicalNameFor(p.id) }
        }
        into(nativeStagingDir.map { it.dir(p.id) })
    }
}

def stageTasks = ['stageLocalNativeLibrary'] +
        nativePlatforms.collect { p -> "stage${p.id}NativeLibrary".toString() }

tasks.register('collectNativeLibraries') {
    description = 'Aggregates all staged platform binaries under one directory.'
    group = 'lte native'
    dependsOn stageTasks

    // Directory output consumed by processResources below.
    outputs.dir(nativeStagingDir)
}

tasks.named('processResources') {
    dependsOn 'collectNativeLibraries'
    from(nativeStagingDir) {
        into 'native'
    }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
