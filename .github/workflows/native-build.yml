name: Native Multi-Platform Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'native/**'
      - '.github/workflows/native-build.yml'
  pull_request:
    paths:
      - 'native/**'

jobs:
  build-native:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x86_64
            os: windows-latest
          # Free hosted ARM64 Windows runner (public repos).
          - id: windows-arm64
            os: windows-11-arm
          - id: linux-x86_64
            os: ubuntu-latest
          # ARM64 where practical (GitHub now provides free arm runners for public repos)
          - id: linux-arm64
            os: ubuntu-24.04-arm
          - id: macos-arm64
            os: macos-latest          # Apple Silicon hosted
          - id: macos-x86_64
            os: macos-13              # last Intel hosted

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install OpenCL development files (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ocl-icd-opencl-dev opencl-headers

      - name: Configure (CMake)
        run: >
          cmake -S native -B native/ci-build
          -DCMAKE_BUILD_TYPE=Release
          -DLTE_JAVA_HOME=$JAVA_HOME

      - name: Build
        run: cmake --build native/ci-build --config Release --parallel

      # Hosted runners have no GPU/ICD: CPU-path assertions still run,
      # GPU assertions are expected to report unavailable there.
      - name: Smoke test (CPU path)
        continue-on-error: true
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./native/ci-build/Release/LTE_Test.exe || true
          else
            ./native/ci-build/LTE_Test || true
          fi

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p native/artifacts/${{ matrix.id }}
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp native/ci-build/Release/LumenTerrainEngine.dll \
               native/artifacts/${{ matrix.id }}/LumenTerrainEngine.dll
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cp native/ci-build/libLumenTerrainEngine.dylib \
               native/artifacts/${{ matrix.id }}/LumenTerrainEngine.dylib
          else
            cp native/ci-build/libLumenTerrainEngine.so \
               native/artifacts/${{ matrix.id }}/LumenTerrainEngine.so
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.id }}
          path: native/artifacts/${{ matrix.id }}/
          if-no-files-found: error

  assemble-jar:
    name: Assemble cross-platform mod JAR
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download all native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native/artifacts
          merge-multiple: false

      # download-artifact creates native-artifacts/<artifact-name>/...
      # normalize into native/artifacts/<platform-id>/LumenTerrainEngine.<ext>
      - name: Normalize artifact layout
        run: |
          ls -la native/artifacts
          for d in native/artifacts/native-*/; do
            id="$(basename "$d")"
            id="${id#native-}"
            mkdir -p "native/artifacts/${id}"
            cp "${d}"/* "native/artifacts/${id}/"
          done
          rm -rf native/artifacts/native-*
          find native/artifacts -type f

      - name: Build mod JAR (bundles all platforms)
        run: ./gradlew build -x check --console=plain --no-daemon

      - name: Verify bundled natives in JAR
        run: |
          jar=$(ls build/libs/*.jar | grep -v sources | head -n1)
          echo "JAR: $jar"
          unzip -l "$jar" | grep -E 'native/(windows|linux|macos)-(x86_64|arm64)/' || {
            echo "ERROR: no native binaries bundled"; exit 1; }
          echo "Platform bundles found: $(unzip -l "$jar" | grep -cE 'native/(windows|linux|macos)-(x86_64|arm64)/(lib)?LumenTerrainEngine')"

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-terrain-engine-cross-platform
          path: build/libs/*.jar
